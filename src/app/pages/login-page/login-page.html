<main class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-sm border border-gray-100">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-semibold text-blue-600">Bienvenido</h1>
      <p class="text-gray-500 mt-2">Ingresa a tu cuenta</p>
    </div>

    <form class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Usuario</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-gray-400 focus:ring-1 focus:ring-gray-400 outline-none transition-colors"
          placeholder="username123"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-gray-400 focus:ring-1 focus:ring-gray-400 outline-none transition-colors"
          placeholder="••••••••"
        />
      </div>


      <button
        type="submit"
        class="w-full py-3 px-4 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-800 focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 transition-colors cursor-pointer"
        routerLink="services"
        (click)="setEmail()"
      >
      <a>Iniciar sesión</a>
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-500">
      ¿No tienes cuenta?
      <a routerLink="/sign-up" class="text-gray-900 font-medium hover:underline">Regístrate</a>
    </p>
  </div>
</main>
