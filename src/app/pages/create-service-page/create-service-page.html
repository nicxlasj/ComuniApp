<div class="max-w-3xl mx-auto px-6 py-12">
  <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">Crear Nuevo Servicio</h1>
  
  <form (submit)="onSubmit($event)" class="bg-white rounded-2xl shadow-lg p-8 border border-gray-100">
    <div class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <label for="serviceName" class="text-gray-700 font-medium">Nombre del Servicio</label>
        <input 
          type="text" 
          id="serviceName"
          name="serviceName"
          placeholder="ej. Consultoría Empresarial"
          class="px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          required
        >
      </div>

      <div class="flex flex-col gap-2">
        <label for="categoryName" class="text-gray-700 font-medium">Categoría</label>
        <select 
          id="categoryName"
          name="categoryName"
          class="px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white"
          required
        >
          <option value="" disabled selected>Selecciona una categoría</option>
          <option value="negocios">Negocios</option>
          <option value="tecnologia">Tecnología</option>
          <option value="marketing">Marketing</option>
          <option value="gestion">Gestión</option>
          <option value="finanzas">Finanzas</option>
          <option value="legal">Legal</option>
          <option value="salud">Salud</option>
          <option value="educacion">Educación</option>
        </select>
      </div>

      <div class="flex flex-col gap-2">
        <label for="serviceDescription" class="text-gray-700 font-medium">Descripción</label>
        <textarea 
          id="serviceDescription"
          name="serviceDescription"
          placeholder="Describe detalladamente tu servicio..."
          rows="5"
          class="px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
          required
        ></textarea>
      </div>

      <div class="flex flex-col gap-2">
        <label for="serviceImage" class="text-gray-700 font-medium">URL de Imagen</label>
        <input 
          type="url" 
          id="serviceImage"
          name="serviceImage"
          placeholder="https://ejemplo.com/imagen.jpg"
          class="px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          required
        >
        <p class="text-sm text-gray-500">Ingresa la URL de una imagen para representar tu servicio</p>
      </div>

      <div class="flex gap-4 pt-4">
        <button 
          type="submit"
          class="flex-1 bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 transition font-medium"
        >
          Crear Servicio
        </button>
        <button 
          type="reset"
          class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-100 transition font-medium"
        >
          Limpiar
        </button>
      </div>
    </div>
  </form>
</div>

@if (showModal()) {
  <div class="fixed inset-0 bg-gray-900/30 backdrop-blur-sm flex items-center justify-center z-50" (click)="closeModal()">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4" (click)="$event.stopPropagation()">
      <div class="flex flex-col items-center text-center">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-4">
          <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>
        <h2 class="text-xl font-bold text-gray-800 mb-2">¡Servicio Creado!</h2>
        <p class="text-gray-600 mb-6">El servicio ha sido creado correctamente.</p>
        <button 
          (click)="closeModal()"
          class="bg-blue-600 text-white py-2 px-8 rounded-lg hover:bg-blue-700 transition font-medium"
        >
          Aceptar
        </button>
      </div>
    </div>
  </div>
}
