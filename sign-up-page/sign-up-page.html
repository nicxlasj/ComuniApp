<main class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-sm border border-gray-100">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-semibold text-blue-600">Crear cuenta</h1>
      <p class="text-gray-500 mt-2">Regístrate para continuar</p>
    </div>

    <form class="space-y-5">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="firstName" class="block text-sm font-medium text-gray-700 mb-2">Nombre</label>
          <input
            type="text"
            id="firstName"
            name="firstName"
            class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-gray-400 focus:ring-1 focus:ring-gray-400 outline-none transition-colors"
            placeholder="Juan"
          />
        </div>

        <div>
          <label for="lastName" class="block text-sm font-medium text-gray-700 mb-2">Apellido</label>
          <input
            type="text"
            id="lastName"
            name="lastName"
            class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-gray-400 focus:ring-1 focus:ring-gray-400 outline-none transition-colors"
            placeholder="Pérez"
          />
        </div>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-gray-400 focus:ring-1 focus:ring-gray-400 outline-none transition-colors"
          placeholder="juan@example.com"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-gray-400 focus:ring-1 focus:ring-gray-400 outline-none transition-colors"
          placeholder="••••••••"
        />
      </div>

      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">Confirmar contraseña</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-gray-400 focus:ring-1 focus:ring-gray-400 outline-none transition-colors"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        class="w-full py-3 px-4 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-800 focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 transition-colors cursor-pointer"
      >
        Crear cuenta
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-500">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="text-gray-900 font-medium hover:underline">Inicia sesión</a>
    </p>
  </div>
</main>
